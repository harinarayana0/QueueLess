services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: queueless
      POSTGRES_USER: queueless
      POSTGRES_PASSWORD: queueless_local
    volumes:
      - queueless_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queueless -d queueless"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      SECRET_KEY: local-docker-secret-change-before-production
      DATABASE_URL: postgresql+psycopg2://queueless:queueless_local@db:5432/queueless
    depends_on:
      db:
        condition: service_healthy

volumes:
  queueless_db:
